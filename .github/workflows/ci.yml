name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      casks:
        description: List of casks to audit (comma-separated)
        required: true
      skip_install:
        description: Skip installation of casks
        required: false
        default: true
        type: boolean
      new_cask:
        description: Apply new cask audit
        required: false
        default: false
        type: boolean

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generate-matrix:
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          core: false
          cask: true

      - name: Check out Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run brew config
        run: brew config

      - name: Generate CI matrix
        id: generate-matrix
        env:
          INPUT_CASKS: ${{ github.event.inputs.casks }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.url }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]
          then
            # shellcheck disable=SC2086 # $INPUT_CASKS is a space-separated list of cask tokens
            brew generate-cask-ci-matrix ${{ github.event.inputs.skip_install && '--skip-install' }} ${{ github.event.inputs.new_cask && '--new' }} --casks $INPUT_CASKS
          elif [[ "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "merge_group" ]]
          then
            brew generate-cask-ci-matrix --syntax-only
          else
            brew generate-cask-ci-matrix --url "$PULL_REQUEST_URL"
          fi

  test:
    name: ${{ matrix.name }}
    needs: generate-matrix
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          core: true
          cask: true
          stable: ${{ matrix.stable || false }}

      - name: Enable debug mode
        run: |
          echo 'HOMEBREW_DEBUG=1' >> "${GITHUB_ENV}"
          echo 'HOMEBREW_VERBOSE=1' >> "${GITHUB_ENV}"
        if: runner.debug

      - name: Check out Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Clean up CI machine
        if: runner.os == 'macOS' && !matrix.stable
        run: brew test-bot --cleanup --only-cleanup-before

      # Xcode 27.1 RC's simdiskimaged intercepts DMG attaches, causing
      # intermittent "no mountable file systems" or vanishing mount points.
      # TODO: remove once the xcode-27 runner image no longer needs this.
      - name: Stop simdiskimaged
        if: matrix.runner == 'xcode-27'
        run: sudo launchctl bootout system/com.apple.CoreSimulator.simdiskimaged || true

      - name: Cache Homebrew Gems
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}-rubygems-

      - name: Cache style cache
        if: runner.os == 'macOS' && !matrix.stable
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/style
          key: macos-style-cache-${{ matrix.stable && 'stable-' || 'main-' }}${{ github.sha }}
          restore-keys: macos-style-cache-${{ matrix.stable && 'stable-' || 'main-' }}

      - name: Run brew config
        run: brew config

      - name: Run brew test-bot --only-tap-syntax
        id: tap-syntax
        run: brew test-bot --tap '${{ matrix.tap }}' --only-tap-syntax ${{ matrix.stable && '--stable' || '' }}
        if: always() && !matrix.cask

      - name: Run brew fetch --cask ${{ matrix.cask.token }}
        id: fetch
        run: |
          brew fetch --cask --retry --force ${{ join(matrix.fetch_args, ' ') }} '${{ matrix.cask.path }}'
        timeout-minutes: 30
        if: >
          always() &&
          contains(fromJSON('["success", "skipped"]'), steps.tap-syntax.outcome) &&
          matrix.cask

      - name: Start disk image monitors
        if: always() && matrix.runner == 'xcode-27' && steps.fetch.outcome == 'success'
        run: |
          mon="${RUNNER_TEMP}/dmg-monitor"
          mkdir -p "${mon}"
          sw_vers
          echo "ImageVersion=${ImageVersion:-unknown}"
          pgrep -lf simdiskimaged || echo "simdiskimaged not running"
          sudo launchctl print system/com.apple.CoreSimulator.simdiskimaged 2>&1 | head -n 5 || true
          hdiutil info
          # shellcheck disable=SC2024
          sudo nohup eslogger mount unmount remount exec > "${mon}/eslogger.jsonl" 2> "${mon}/eslogger.err" &
          # shellcheck disable=SC2024
          sudo nohup log stream --level debug --style compact --predicate \
            'process IN {"diskarbitrationd", "diskimages-helper", "hdiutil", "hdiejectd", "simdiskimaged", "diskimagescontroller", "diskimagesiod", "cryptexd", "CoreSimulatorService", "sandboxd", "ditto", "mkbom", "diskutil"} OR subsystem BEGINSWITH "com.apple.DiskImages" OR subsystem BEGINSWITH "com.apple.diskimages" OR (process == "kernel" AND (eventMessage CONTAINS[c] "sandbox" OR eventMessage CONTAINS "homebrew-dmg" OR eventMessage CONTAINS[c] "unmount"))' \
            > "${mon}/log.txt" 2>&1 &
          # shellcheck disable=SC2016
          nohup perl -MTime::HiRes=time,sleep -e '
            $| = 1; my $prev = "";
            while (1) {
              my $cur = join "", grep { /homebrew-dmg/ } `/sbin/mount`;
              if ($cur ne $prev) {
                my $t = time; my @l = localtime $t;
                printf "%02d:%02d:%06.3f %s", $l[2], $l[1], $l[0] + $t - int($t), ($cur eq "" ? "<no homebrew-dmg mounts>\n" : $cur);
                $prev = $cur;
              }
              sleep 0.05;
            }' > "${mon}/mounts.txt" 2>&1 &
          echo $! > "${mon}/mounts.pid"
          sleep 3
          cat "${mon}/eslogger.err"

      - name: Run brew audit --cask${{ (matrix.cask && ' ') || ' --tap ' }}${{ matrix.cask.token || matrix.tap }}
        id: audit
        run: |
          brew audit --cask ${{ join(matrix.audit_args, ' ') }}${{ (matrix.cask && ' ') || ' --tap ' }}'${{ matrix.cask.token || matrix.tap }}'
        timeout-minutes: 30
        if: >
          always() &&
          contains(fromJSON('["success", "skipped"]'), steps.tap-syntax.outcome) &&
          (!matrix.cask || steps.fetch.outcome == 'success') &&
          !matrix.skip_audit

      - name: Gather cask information
        id: info
        env:
          CASK_PATH: ${{ matrix.cask.path }}
        run: brew cask-ci info "$CASK_PATH"
        if: always() && steps.fetch.outcome == 'success' && matrix.cask

      - name: Uninstall conflicting formulae
        run: |
          read -r -a formula_conflicts_array <<< "$FORMULA_CONFLICTS"
          brew uninstall --formula "${formula_conflicts_array[@]}"
        if: ${{ always() && steps.info.outcome == 'success' && env.FORMULA_CONFLICTS != '' }}
        timeout-minutes: 30

      - name: Uninstall conflicting casks
        run: |
          read -r -a cask_conflicts_array <<< "$CASK_CONFLICTS"
          brew uninstall --cask "${cask_conflicts_array[@]}"
        if: ${{ always() && steps.info.outcome == 'success' && env.CASK_CONFLICTS != '' }}
        timeout-minutes: 30

      - name: Run brew uninstall --cask --force --zap ${{ matrix.cask.token }}
        run: |
          brew uninstall --cask --force --zap '${{ matrix.cask.path }}'
        if: always() && steps.info.outcome == 'success'
        timeout-minutes: 30

      - name: Take snapshot of installed and running apps and services (macOS only)
        id: snapshot
        run: brew cask-ci snapshot
        if: always() && steps.info.outcome == 'success' && runner.os == 'macOS'

      - name: Run brew install --cask ${{ matrix.cask.token }}
        id: install
        run: brew install --cask '${{ matrix.cask.path }}'
        if: >
          always() && steps.info.outcome == 'success' &&
          fromJSON(steps.info.outputs.macos_requirement_satisfied) &&
          !matrix.skip_install
        timeout-minutes: 30

      - name: Check for missing zap paths
        run: brew cask-ci zap-check '${{ matrix.cask.path }}'
        if: >
          always() &&
          steps.install.outcome == 'success' &&
          runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 10

      - name: Run brew uninstall --cask ${{ matrix.cask.token }}
        run: brew uninstall --cask '${{ matrix.cask.path }}'
        if: always() && steps.install.outcome == 'success' && !fromJSON(steps.info.outputs.manual_installer)
        timeout-minutes: 30

      - name: Uninstall cask dependencies
        run: |
          read -r -a cask_dependencies_array <<< "$CASK_DEPENDENCIES"
          brew uninstall --cask "${cask_dependencies_array[@]}"
        if: ${{ always() && steps.install.outcome == 'success' && env.CASK_DEPENDENCIES != '' }}
        timeout-minutes: 30

      - name: Compare installed and running apps and services with snapshot (macOS only)
        run: brew cask-ci check '${{ matrix.cask.path }}'
        if: always() && steps.snapshot.outcome == 'success' && steps.install.outcome == 'success' && runner.os == 'macOS'

      - name: Disk image monitor output
        if: always() && matrix.runner == 'xcode-27' && steps.fetch.outcome == 'success'
        run: |
          mon="${RUNNER_TEMP}/dmg-monitor"
          sleep 2
          kill "$(cat "${mon}/mounts.pid")" || true
          sudo pkill -x eslogger || true
          sudo pkill -f "log stream --level debug" || true
          sudo chown -R "$(id -u)" "${mon}"

          echo "::group::simdiskimaged at end of job"
          pgrep -lf simdiskimaged || echo "simdiskimaged not running"
          sudo launchctl print system/com.apple.CoreSimulator.simdiskimaged 2>&1 | head -n 5 || true
          echo "::endgroup::"

          echo "::group::homebrew-dmg mount timeline"
          cat "${mon}/mounts.txt"
          echo "::endgroup::"

          echo "::group::eslogger mount/unmount and disk tool execs"
          cat "${mon}/eslogger.err"
          jq -c '
            select((.event // {}) | (has("mount") or has("unmount") or has("remount") or
              (has("exec") and ((.exec.target.executable.path // "") | test("diskutil|umount|hdiutil|ditto|mkbom|simdiskimaged|diskimages")))))
            | {time, pid: .process.audit_token.pid, ppid: .process.ppid, proc: .process.executable.path,
               event: (.event | tostring | .[0:800])}
          ' "${mon}/eslogger.jsonl" || grep -E 'unmount|"mount"' "${mon}/eslogger.jsonl" | head -n 50 || true
          echo "::endgroup::"

          echo "::group::unified log (filtered)"
          grep -vE 'CoreAnalytics|xpc:connection|libimage4|cfprefsd' "${mon}/log.txt" | tail -n 1500 || true
          echo "::endgroup::"

      - name: Upload disk image monitor files
        if: always() && matrix.runner == 'xcode-27' && steps.fetch.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg-monitor-${{ matrix.cask.token }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dmg-monitor
          if-no-files-found: ignore

  conclusion:
    name: conclusion
    needs: test
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Result
        run: ${{ needs.test.result == 'success' }}
