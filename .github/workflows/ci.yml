name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      casks:
        description: List of casks to audit (comma-separated)
        required: true
      skip_install:
        description: Skip installation of casks
        required: false
        default: true
        type: boolean
      new_cask:
        description: Apply new cask audit
        required: false
        default: false
        type: boolean

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}

concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tap_syntax:
    name: tap_syntax${{ case(matrix.stable, ' (stable)', '') }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        stable: [false, true]
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          cask: true
          stable: ${{ matrix.stable }}

      - name: Cache style cache
        if: ${{ !matrix.stable }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew/style
          key: macos-style-cache-main-${{ github.sha }}
          restore-keys: macos-style-cache-main-

      - run: brew test-bot --only-tap-syntax ${STABLE:+"--stable"}
        env:
          HOMEBREW_SORBET_RECURSIVE: 1
          STABLE: ${{ case(matrix.stable, '1', '') }}

  packages_detect:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    outputs:
      testing_casks: ${{ steps.packages-detect.outputs.testing_casks }}
      added_casks: ${{ steps.packages-detect.outputs.added_casks }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          cask: true

      - run: brew test-bot --only-packages-detect
        id: packages-detect

  setup_runners:
    needs: packages_detect
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (needs.packages_detect.result == 'success' && needs.packages_detect.outputs.testing_casks != ''))
    outputs:
      runners: ${{ steps.determine-runners.outputs.runners }}
      runners_present: ${{ steps.determine-runners.outputs.runners_present }}
      git-cache-key: ${{ steps.git-cache.outputs.key }}
    runs-on: macos-latest
    permissions:
      actions: read # to check which run saved the Git cache
      contents: read
    steps:
      # Not `setup-homebrew`: runner selection only needs the cask files at the tested revision.
      - name: Update Homebrew
        run: |
          repository="$(brew --repository)"
          git -C "${repository}" config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          git -C "${repository}" fetch --force --tags origin
          git -C "${repository}" remote set-head origin --auto
          git -C "${repository}" checkout --force -B main origin/HEAD

      - name: Check out Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tap the checkout
        run: |
          tap="$(brew --repository)/Library/Taps/homebrew/homebrew-cask"
          mkdir -p "$(dirname "${tap}")"
          rm -rf "${tap}"
          ln -s "${GITHUB_WORKSPACE}" "${tap}"

      - name: Determine runners for casks
        id: determine-runners
        env:
          TESTING_CASKS: ${{ inputs.casks || needs.packages_detect.outputs.testing_casks }}
          ADDED_CASKS: ${{ needs.packages_detect.outputs.added_casks }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.url }}
          SKIP_INSTALL: ${{ inputs.skip_install && '1' || '' }}
          NEW_CASK: ${{ inputs.new_cask && '1' || '' }}
        run: |
          brew determine-test-runners --cask "$TESTING_CASKS" "$ADDED_CASKS" \
            ${PULL_REQUEST_URL:+--url="$PULL_REQUEST_URL"} ${SKIP_INSTALL:+"--skip-install"} ${NEW_CASK:+"--new"}

      # Any job on the default branch can save a cache under any key, and restoring one runs whatever it holds.
      # So `test` only gets a key if the newest scheduled `git-cache.yml` run has exactly one cache, saved while it ran.
      # Otherwise `test` restores nothing and `setup-homebrew` clones the tap in full.
      - name: Find Git cache
        id: git-cache
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          run="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/git-cache.yml/runs" \
              --raw-field branch="${DEFAULT_BRANCH}" --raw-field event=schedule --raw-field status=success \
              --raw-field per_page=1 \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.run_started_at) \(.updated_at)"'
          )" || run=""
          read -r run_id started finished <<<"${run}" || true
          if [[ -z "${run_id}" ]]
          then
            echo "No successful scheduled Git cache run found."
            exit 0
          fi

          prefix="git-snapshot-${run_id}-"
          caches="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/caches" \
              --raw-field key="${prefix}" --raw-field ref="refs/heads/${DEFAULT_BRANCH}" --raw-field per_page=100
          )" || caches="{}"
          key="$(
            jq --raw-output --arg prefix "${prefix}" --arg started "${started}" --arg finished "${finished}" '
              def seconds: sub("\\.[0-9]+Z$"; "Z") | fromdate;
              [.actions_caches[]? | select(.key | startswith($prefix))] as $caches |
              [
                $caches[] | (.created_at | seconds) as $created |
                  select($created >= ($started | seconds) and $created <= ($finished | seconds))
              ] as $saved |
              select(
                .total_count == (.actions_caches | length) and ($saved | length) == 1 and
                  ([$caches[] | select(.key == $saved[0].key)] | length) == 1
              ) | $saved[0].key
            ' <<<"${caches}"
          )" || key=""
          if [[ "${key}" =~ ^git-snapshot-[0-9]+-[0-9a-f]{32}$ ]]
          then
            echo "key=${key}" >>"${GITHUB_OUTPUT}"
          else
            echo "::warning::Run ${run_id} does not have exactly one Git cache saved while it ran, so not restoring one."
          fi

  test:
    name: ${{ matrix.name }}
    needs: [tap_syntax, setup_runners]
    if: >-
      !cancelled() && needs.tap_syntax.result == 'success' &&
      needs.setup_runners.result == 'success' && fromJson(needs.setup_runners.outputs.runners_present)
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup_runners.outputs.runners) }}
    steps:
      # Until `setup-homebrew` fixes their ACLs, the container user can't write the directories the runner mounts.
      # The image also has no `zstd`, without which the cache lookup misses the zstd-compressed snapshot.
      # On failure the restore is skipped and `setup-homebrew` clones the tap, as before.
      - name: Prepare container for Git cache
        id: prepare-container
        if: matrix.container && needs.setup_runners.outputs.git-cache-key
        continue-on-error: true
        run: |
          user="$(whoami)"
          sudo setfacl --recursive --modify="d:u:${user}:rwX,u:${user}:rwX" "${RUNNER_WORKSPACE}" "${RUNNER_TEMP}"
          sudo apt-get update --quiet=2
          sudo apt-get install --yes --quiet=2 --no-install-recommends zstd

      # A full clone saved daily by `git-cache.yml`. `setup-homebrew` keeps an existing tap and only fetches newer commits.
      # No `restore-keys`: only the exact key that `setup_runners` checked may be restored.
      # Without the ACLs the restore can't write its outputs and would fail the job, so it needs the preparation.
      - name: Restore Git cache
        id: git-cache
        if: >
          needs.setup_runners.outputs.git-cache-key &&
          (!matrix.container || steps.prepare-container.outcome == 'success')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git
          key: ${{ needs.setup_runners.outputs.git-cache-key }}

      - name: Seed tap from Git cache
        if: steps.git-cache.outputs.cache-matched-key
        env:
          CONTAINER: ${{ matrix.container && 'true' || '' }}
        run: |
          tap="$(brew --repository "${GITHUB_REPOSITORY}")"
          mkdir -p "${tap}"
          # On a bare runner `setup-homebrew` moves the tap into the workspace, so `actions/checkout` reuses it.
          # In a container it doesn't, so the workspace keeps a copy to save `actions/checkout` a full fetch.
          # The tap is on another filesystem there, so a move would copy `.git` anyway.
          # Steps in a container run in `sh`, which has no `[[`.
          if [ -n "${CONTAINER}" ]
          then
            cp -a .git "${tap}/.git"
          else
            mv .git "${tap}/.git"
          fi
          # The snapshot's remote branches are up to a day old. Unpruned, a branch since replaced by
          # `<branch>/<name>` (or the reverse) makes `setup-homebrew`'s fetch fail.
          git -C "${tap}" config fetch.prune true
          git -C "${tap}" checkout --force --quiet

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          core: false
          cask: true
          stable: false

      - name: Enable debug mode
        run: |
          echo 'HOMEBREW_DEBUG=1' >> "${GITHUB_ENV}"
          echo 'HOMEBREW_VERBOSE=1' >> "${GITHUB_ENV}"
        if: runner.debug

      - name: Check out Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Clean up CI machine
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_INSTALL_FROM_API: ""
        run: brew test-bot --cleanup --only-cleanup-before

      # An archive stores the gems' path relative to the workspace, which differs between a container and a bare
      # runner, so neither can restore the other's. `cache.yml` saves the bare runner's under the unsuffixed key.
      - name: Cache Homebrew Gems
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}${{ matrix.container && '-container' || '' }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}${{ matrix.container && '-container' || '' }}-rubygems-

      - name: Run brew config
        run: brew config

      # On xcode-27, anything that starts CoreSimulator (e.g. `brew config`) launches
      # simdiskimaged, which then unmounts or moves other disk images while re-adding a
      # duplicate watchOS runtime: "no mountable file systems" or vanishing mount points.
      # Stop it after `brew config` and before any DMG is opened.
      # TODO: remove once the xcode-27 runner image no longer needs this.
      - name: Stop simdiskimaged
        if: matrix.runner == 'xcode-27'
        run: |
          sudo launchctl disable system/com.apple.CoreSimulator.simdiskimaged || true
          sudo launchctl bootout system/com.apple.CoreSimulator.simdiskimaged || true
          sudo pkill -x simdiskimaged || true

      - name: Run brew test-bot --only-casks
        env:
          CASK: ${{ matrix.cask.token }}
          TEST_BOT_CASKS_ARGS: ${{ join(matrix.test_bot_args, ' ') }}
          HOMEBREW_NO_INSTALL_FROM_API: ""
        shell: bash
        run: xargs -t brew test-bot --verbose "$CASK" <<<"$TEST_BOT_CASKS_ARGS"
        timeout-minutes: 120

  conclusion:
    name: conclusion
    needs: [tap_syntax, packages_detect, setup_runners, test]
    runs-on: ubuntu-slim
    if: ${{ !cancelled() }}
    steps:
      - name: Result
        run: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
