name: Remove disabled packages

on:
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/remove-disabled-packages.yml
  schedule:
    # Once every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: remove-disabled-packages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  remove-disabled-packages:
    if: github.repository_owner == 'Homebrew'
    runs-on: macos-latest
    outputs:
      partially-disabled-packages: ${{ steps.remove_disabled.outputs.partially-disabled-packages }}
    env:
      REMOVAL_BRANCH: remove-disabled-packages
    permissions:
      contents: write # for Homebrew/actions/git-try-push
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          core: false
          cask: true

      - name: Configure Git user
        id: git-user-config
        uses: Homebrew/actions/git-user-config@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          username: BrewTestBot

      - name: Set up commit signing
        uses: Homebrew/actions/setup-commit-signing@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          signing_key: ${{ secrets.BREWTESTBOT_SSH_SIGNING_KEY }}

      - name: Checkout removal branch
        run: git checkout -b "$REMOVAL_BRANCH" origin/HEAD
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}

      - name: Remove disabled packages
        id: remove_disabled
        uses: Homebrew/actions/remove-disabled-packages@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        env:
          HOMEBREW_NO_INSTALL_FROM_API: 1

      - name: Push commits
        if: fromJson(steps.remove_disabled.outputs.packages-removed)
        uses: Homebrew/actions/git-try-push@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: ${{ env.REMOVAL_BRANCH }}
        env:
          GIT_COMMITTER_NAME: ${{ steps.git-user-config.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.git-user-config.outputs.email }}

      - name: Create pull request
        id: pr-create
        if: fromJson(steps.remove_disabled.outputs.packages-removed)
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_PUBLIC_REPO_TOKEN }}
          PR_BODY: >
            This pull request was created automatically by the
            [`remove-disabled-packages`](https://github.com/Homebrew/homebrew-cask/blob/HEAD/.github/workflows/remove-disabled-packages.yml)
            workflow.
        run: |
          gh pr create \
            --body "$PR_BODY" \
            --head "$REMOVAL_BRANCH" \
            --title 'Remove disabled packages'

  partially-disabled-issue:
    needs: remove-disabled-packages
    runs-on: ubuntu-slim
    permissions:
      issues: write # for Homebrew/actions/create-or-update-issue
    steps:
      - name: Report partially disabled casks
        uses: Homebrew/actions/create-or-update-issue@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          # Keep the default `GITHUB_TOKEN`: issues it opens don't trigger `check-issues.yml`,
          # which would otherwise close this one for not following an issue template.
          title: Partially disabled casks ready for cleanup
          body: |
            These casks have been disabled for more than a year on some platforms but not others, so the [`remove-disabled-packages`](https://github.com/Homebrew/homebrew-cask/blob/HEAD/.github/workflows/remove-disabled-packages.yml) workflow can't remove them. Drop the disabled platforms by hand, since deleting the `disable!` alone would re-enable them: remove the URLs, checksums and artifacts only those platforms use, and restrict the cask to the platforms it still supports (e.g. `depends_on arch: :arm64`, `depends_on :linux` or a higher `depends_on macos:`).

            ${{ needs.remove-disabled-packages.outputs.partially-disabled-packages }}
          labels: help wanted
          update-existing: ${{ needs.remove-disabled-packages.outputs.partially-disabled-packages != '' }}
          skip-if-unchanged: true
          close-existing: ${{ needs.remove-disabled-packages.outputs.partially-disabled-packages == '' }}
          close-from-author: github-actions[bot]
          close-comment: No partially disabled casks are left, closing issue.
