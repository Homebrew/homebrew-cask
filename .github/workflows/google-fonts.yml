name: Google Fonts
permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - debug-google-fonts
  schedule:
    - cron: "0 0 * * 0" # weekly
  workflow_dispatch:

jobs:
  google-fonts:
    name: ${{ matrix.mode }}
    if: github.repository == 'Homebrew/homebrew-cask'
    runs-on: ubuntu-latest
    env:
      BRANCH: auto-${{ matrix.mode }}-google-fonts
    strategy:
      matrix:
        include:
          - noun: addition
            mode: add
          - noun: update
            mode: update
          - noun: deletion
            mode: delete
    steps:
      - name: Checkout homebrew/cask
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout google/fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: google/fonts
          path: vendor/google-fonts
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Install Python packages
        run: pip3 install gfmetadata html2text jinja2 protobuf

      - name: Configure Git user
        id: git-user-config
        uses: Homebrew/actions/git-user-config@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          username: ${{ (github.event_name == 'workflow_dispatch' && github.actor) || 'BrewTestBot' }}

      - name: Set up commit signing
        uses: Homebrew/actions/setup-commit-signing@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          signing_key: ${{ secrets.BREWTESTBOT_SSH_SIGNING_KEY }}

      - name: Import Google Fonts
        run: ./developer/bin/import_google_fonts vendor/google-fonts ${{ matrix.mode }}

      - name: Check for changes
        id: changes-check
        run: |
          git add Casks
          if git diff --cached --stat --exit-code
          then
            echo "changes=false" >> "$GITHUB_ENV"
          else
            echo "changes=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout branch
        if: env.changes == 'true'
        run: git checkout -b "$BRANCH"

      - name: Create commits
        if: env.changes == 'true'
        run: |
            # Silence lint error to avoid excessive double quote escaping.
            # shellcheck disable=SC2016
            git diff --cached --name-only -z |  xargs -0 -I {} sh -c '
              MESSAGE="$(basename "{}" .rb)"
              git commit "{}" --message="$MESSAGE: $MODE" --message="$COMMIT_BODY"'
        env:
          COMMIT_BODY: >
            This commit was created automatically by the
            [\`google-fonts\`](https://github.com/Homebrew/homebrew-cask/blob/HEAD/.github/workflows/google-fonts.yml)
            workflow.
          GIT_COMMITTER_NAME: ${{ steps.git-user-config.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.git-user-config.outputs.email }}
          MODE: ${{ matrix.mode }}

      - name: Push new branch
        id: push-new
        if: env.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Existing PRs need a bot push to trigger CI on the new head.
          if git ls-remote --exit-code --heads origin "$BRANCH"
          then
            echo "existing=true" >> "$GITHUB_OUTPUT"
          elif [[ $? == 2 ]]
          then
            git -c 'credential.helper=!gh auth git-credential' push \
              --force-with-lease="refs/heads/$BRANCH:" origin "$BRANCH"
          else
            exit 1
          fi

      - name: Update existing branch as BrewTestBot
        if: env.changes == 'true' && steps.push-new.outputs.existing == 'true'
        uses: Homebrew/actions/git-try-push@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          token: ${{ secrets.HOMEBREW_GITHUB_PUBLIC_REPO_TOKEN }}
          branch: ${{ env.BRANCH }}
          GIT_COMMITTER_NAME: ${{ steps.git-user-config.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.git-user-config.outputs.email }}


      - name: Create pull request with updated files
        if: env.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_PUBLIC_REPO_TOKEN }}
          PR_BODY: >
            This pull request was created automatically by the
            [`google-fonts`](https://github.com/Homebrew/homebrew-cask/blob/HEAD/.github/workflows/google-fonts.yml)
            workflow.
        run: |
          gh pr create \
            --body "$PR_BODY" \
            --head "$BRANCH" \
            --title "${{matrix.mode}} Google Fonts"
